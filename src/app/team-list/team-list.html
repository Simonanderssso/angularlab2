<h2>Lag</h2>
@if (leagueIdIn() === null) {
    <p>Välj en liga till för att se lag</p>
} @else if (loading()) {
    <p>Loading...</p>
} @else if (error()) {
    <p>{{ error() }}</p>
} @else {
    <ul>
        @for (team of teams(); track team.id) {
            <li>{{ team.name }}</li>
        } @empty {
            <li>Inga lag finns i ligan.</li>
        }
    </ul>
}
